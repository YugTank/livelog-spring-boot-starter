<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Log Dashboard</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #667085;
            --border: #d8e0ec;
            --shadow: 0 14px 40px rgba(31, 41, 55, 0.12);
            --info: #16a34a;
            --debug: #2563eb;
            --warn: #ca8a04;
            --error: #dc2626;
            --trace: #9333ea;
            --fatal: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            width: min(1500px, calc(100% - 24px));
            margin: 0 auto;
            padding: 28px 0;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
        }

        .title-block h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.15;
        }

        .title-block p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .status-card {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 190px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 6px 18px rgba(31, 41, 55, 0.06);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-dot.connected {
            background: var(--info);
            box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.14);
        }

        .status-dot.error {
            background: var(--error);
            box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.14);
        }

        .status-label {
            display: block;
            font-size: 12px;
            color: var(--muted);
        }

        #connectionStatus {
            display: block;
            font-weight: 700;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
        }

        .stat span {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat strong {
            display: block;
            margin-top: 6px;
            font-size: 24px;
        }

        .log-panel {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .toolbar h2 {
            margin: 0;
            font-size: 16px;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 13px;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            user-select: none;
        }

        .toggle input {
            accent-color: #2563eb;
        }

        #logs {
            height: min(68vh, 680px);
            min-height: 360px;
            overflow-y: auto;
            padding: 10px;
            background: #0f172a;
            font-family: "Cascadia Mono", "Consolas", monospace;
            font-size: 14px;
        }

        .empty-state {
            display: grid;
            place-items: center;
            height: 100%;
            color: #94a3b8;
            text-align: center;
        }

        .log-entry {
            display: grid;
            grid-template-columns: minmax(210px, 230px) 92px minmax(180px, 260px) minmax(170px, 230px) minmax(280px, 1fr);
            gap: 14px;
            align-items: start;
            padding: 10px 12px;
            border-left: 4px solid #64748b;
            border-radius: 6px;
            color: #dbe4f0;
            line-height: 1.45;
        }

        .log-entry + .log-entry {
            margin-top: 6px;
        }

        .log-entry:nth-child(even) {
            background: rgba(255, 255, 255, 0.035);
        }

        .log-time {
            color: #94a3b8;
            white-space: nowrap;
            min-width: 0;
        }

        .log-meta {
            color: #a5b4fc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .log-level {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 72px;
            width: fit-content;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .log-message {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .level-info {
            border-left-color: var(--info);
        }

        .level-info .log-level {
            background: rgba(22, 163, 74, 0.18);
            color: #86efac;
        }

        .level-debug {
            border-left-color: var(--debug);
        }

        .level-debug .log-level {
            background: rgba(37, 99, 235, 0.18);
            color: #93c5fd;
        }

        .level-warn,
        .level-warning {
            border-left-color: var(--warn);
        }

        .level-warn .log-level,
        .level-warning .log-level {
            background: rgba(202, 138, 4, 0.2);
            color: #fde68a;
        }

        .level-error {
            border-left-color: var(--error);
        }

        .level-error .log-level {
            background: rgba(220, 38, 38, 0.2);
            color: #fecaca;
        }

        .level-fatal {
            border-left-color: var(--fatal);
        }

        .level-fatal .log-level {
            background: rgba(185, 28, 28, 0.26);
            color: #fee2e2;
        }

        .level-trace {
            border-left-color: var(--trace);
        }

        .level-trace .log-level {
            background: rgba(147, 51, 234, 0.2);
            color: #d8b4fe;
        }

        @media (max-width: 720px) {
            .page {
                width: min(100% - 20px, 1500px);
                padding: 18px 0;
            }

            .header,
            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .log-entry {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .log-meta {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="header">
        <div class="title-block">
            <h1>Live Log Dashboard</h1>
            <p>Streaming Spring Boot logs in real time.</p>
        </div>

        <div class="status-card" aria-live="polite">
            <span id="statusDot" class="status-dot"></span>
            <div>
                <span class="status-label">Connection</span>
                <span id="connectionStatus">Connecting...</span>
            </div>
        </div>
    </header>

    <section class="stats" aria-label="Log summary">
        <div class="stat">
            <span>Total logs</span>
            <strong id="totalCount">0</strong>
        </div>
        <div class="stat">
            <span>Info</span>
            <strong id="infoCount">0</strong>
        </div>
        <div class="stat">
            <span>Warnings</span>
            <strong id="warnCount">0</strong>
        </div>
        <div class="stat">
            <span>Errors</span>
            <strong id="errorCount">0</strong>
        </div>
    </section>

    <section class="log-panel">
        <div class="toolbar">
            <h2>Log Stream</h2>
            <div class="toolbar-actions">
                <span id="lastUpdated">Waiting for logs</span>
            </div>
        </div>
        <div id="logs">
            <div id="emptyState" class="empty-state">No logs received yet.</div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    const logsContainer = document.getElementById('logs');
    const emptyState = document.getElementById('emptyState');
    const statusDot = document.getElementById('statusDot');
    const connectionStatus = document.getElementById('connectionStatus');
    const lastUpdated = document.getElementById('lastUpdated');
    let stompClient = null;
    let activeSocket = null;
    let logSubscription = null;
    let reconnectTimer = null;
    let isConnecting = false;
    const seenLogKeys = new Set();
    const seenLogOrder = [];
    const counts = {
        total: document.getElementById('totalCount'),
        info: document.getElementById('infoCount'),
        warn: document.getElementById('warnCount'),
        error: document.getElementById('errorCount')
    };
    const totals = {
        total: 0,
        info: 0,
        warn: 0,
        error: 0
    };

    function setConnectionStatus(status, className) {
        connectionStatus.innerText = status;
        statusDot.className = `status-dot ${className || ''}`.trim();
    }

    function normalizeLevel(level) {
        return String(level || 'info').toLowerCase();
    }

    function formatTimestamp(timestamp) {
        const numericTimestamp = Number(timestamp);
        const date = timestamp
            ? new Date(Number.isNaN(numericTimestamp) ? timestamp : numericTimestamp)
            : new Date();

        if (Number.isNaN(date.getTime())) {
            return new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        return date.toLocaleString([], {
            year: 'numeric',
            month: 'short',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    function updateCounts(level) {
        totals.total += 1;

        if (level === 'info') {
            totals.info += 1;
        }

        if (level === 'warn' || level === 'warning') {
            totals.warn += 1;
        }

        if (level === 'error' || level === 'fatal') {
            totals.error += 1;
        }

        counts.total.innerText = totals.total;
        counts.info.innerText = totals.info;
        counts.warn.innerText = totals.warn;
        counts.error.innerText = totals.error;
    }

    function getLogKey(log) {
        return [
            log.timestamp ?? log.time ?? log.createdAt ?? '',
            log.level ?? '',
            log.loggerName ?? '',
            log.threadName ?? '',
            log.message ?? ''
        ].join('|');
    }

    function isDuplicateLog(log) {
        const key = getLogKey(log);

        if (seenLogKeys.has(key)) {
            return true;
        }

        seenLogKeys.add(key);
        seenLogOrder.push(key);

        if (seenLogOrder.length > 500) {
            seenLogKeys.delete(seenLogOrder.shift());
        }

        return false;
    }

    function appendLog(log) {
        const level = normalizeLevel(log.level);
        const entry = document.createElement('div');
        const timestamp = log.timestamp ?? log.time ?? log.createdAt;

        entry.className = `log-entry level-${level}`;
        entry.innerHTML = `
            <span class="log-time">${formatTimestamp(timestamp)}</span>
            <span class="log-level">${level}</span>
            <span class="log-meta"></span>
            <span class="log-meta"></span>
            <span class="log-message"></span>
        `;
        const meta = entry.querySelectorAll('.log-meta');
        meta[0].innerText = log.loggerName || '-';
        meta[0].title = log.loggerName || 'Logger unavailable';
        meta[1].innerText = log.threadName || '-';
        meta[1].title = log.threadName || 'Thread unavailable';
        entry.querySelector('.log-message').innerText = log.message || '';

        emptyState.style.display = 'none';
        logsContainer.appendChild(entry);
        updateCounts(level);

        lastUpdated.innerText = `Last log: ${formatTimestamp(timestamp)}`;

        logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    function scheduleReconnect() {
        if (reconnectTimer) {
            return;
        }

        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connectLiveLogs();
        }, 3000);
    }

    function cleanupConnection(disconnectClient) {
        if (logSubscription) {
            try {
                logSubscription.unsubscribe();
            } catch (error) {
                console.warn('Unable to unsubscribe from previous log stream', error);
            }

            logSubscription = null;
        }

        if (activeSocket) {
            activeSocket.onclose = null;
            activeSocket = null;
        }

        if (stompClient && disconnectClient && stompClient.connected) {
            try {
                stompClient.disconnect(function () {});
            } catch (error) {
                console.warn('Unable to disconnect previous STOMP client', error);
            }
        }

        stompClient = null;
    }

    function handleDisconnect() {
        setConnectionStatus('Disconnected', 'error');
        cleanupConnection(false);
        isConnecting = false;
        scheduleReconnect();
    }

    function connectLiveLogs() {
        if (isConnecting || (stompClient && stompClient.connected)) {
            return;
        }

        isConnecting = true;
        const socket = new SockJS('/ws');
        const client = Stomp.over(socket);

        activeSocket = socket;
        stompClient = client;
        socket.onclose = handleDisconnect;

        client.connect({}, function () {
            if (client !== stompClient) {
                return;
            }

            isConnecting = false;
            setConnectionStatus('Connected', 'connected');
            console.log("Connected");

            if (logSubscription) {
                logSubscription.unsubscribe();
            }

            logSubscription = client.subscribe('/topic/log', function (message) {
                const log = JSON.parse(message.body);

                if (isDuplicateLog(log)) {
                    return;
                }

                appendLog(log);
            });
        }, function () {
            if (client === stompClient) {
                handleDisconnect();
            }
        });
    }

    connectLiveLogs();
</script>
</body>
</html>
